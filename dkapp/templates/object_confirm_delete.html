{% extends "base.html" %}
{% block title %}Löschen bestätigen{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 border-top border-danger border-4">
            <div class="card-body p-4 text-center">
                <div class="display-1 text-danger mb-4">
                    <i class="bi bi-exclamation-octagon"></i>
                </div>
                <h3 class="h4 fw-bold mb-3">Löschen bestätigen</h3>
                <p class="text-muted mb-4">
                    Bist du sicher, dass du <strong class="text-dark">{{ object }}</strong> unwiderruflich löschen möchtest?
                </p>
                <form action="" method="post">
                    {% csrf_token %}
                    <div class="d-grid gap-2 d-md-flex justify-content-md-center mt-4">
                        <button type="button" class="btn btn-outline-secondary px-4 me-md-2" onclick="window.history.go(-1);">
                            Abbrechen
                        </button>
                        <button class="btn btn-danger px-4" type="submit">
                            <i class="bi bi-trash me-1"></i> Endgültig löschen
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
